events {}

http {
    upstream tienda_luis {
        server nodo1:7000 max_fails=1 fail_timeout=5s;
        server nodo2:7000 max_fails=1 fail_timeout=5s;
        server nodo3:7000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            proxy_pass http://tienda_luis/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location /api/ {
            proxy_pass http://tienda_luis/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
