upstream tienda_luis {
    zone tienda_luis 64k;

    server 172.30.0.11:7000 max_fails=1 fail_timeout=5s;
    server 172.30.0.12:7000 max_fails=1 fail_timeout=5s;
    server 172.30.0.13:7000 max_fails=1 fail_timeout=5s;
}

# HTTP -> HTTPS (igual que el VirtualHost :80 de Apache en la Fase 2)
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tienda-luis.local localhost;

    ssl_certificate     /etc/nginx/ssl/tienda-luis.local.pem;
    ssl_certificate_key /etc/nginx/ssl/tienda-luis.local+3-key.pem;

    add_header X-Upstream $upstream_addr always;

    location /health {
        proxy_pass http://tienda_luis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location /api/ {
        proxy_pass http://tienda_luis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}