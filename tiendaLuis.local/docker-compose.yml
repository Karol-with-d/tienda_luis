services:
  nodo1:
    image: tiendaluis-api
    hostname: nodo1
    volumes:
      - ./data:/app/data   # inventario compartido entre nodos
    networks:
      clusternet:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7000/health"]
      interval: 5s
      retries: 2

  nodo2:
    image: tiendaluis-api
    hostname: nodo2
    volumes:
      - ./data:/app/data
    networks:
      clusternet:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7000/health"]
      interval: 5s
      retries: 2

  nodo3:
    image: tiendaluis-api
    hostname: nodo3
    volumes:
      - ./data:/app/data
    networks:
      clusternet:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7000/health"]
      interval: 5s
      retries: 2

  lb:
    image: nginx:alpine
    ports: ["8080:80"]                     # único puerto abierto hacia afuera
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks: ["clusternet"]
    depends_on: [nodo1, nodo2, nodo3]

networks:
  clusternet:
    ipam:
      config:
        - subnet: 172.30.0.0/24