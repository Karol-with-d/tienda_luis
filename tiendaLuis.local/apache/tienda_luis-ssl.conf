<VirtualHost *:80>
    ServerName tienda-luis.local
    Redirect permanent / http://tienda-luis.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName tienda-luis.local
    DocumentRoot /var/www/tienda_luis

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/tienda-luis.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/tienda-luis.local-key.pem

    ProxyPreserveHost On
    ProxyPass        /api/ http://localhost:7000/
    ProxyPassReverse /api/ http://localhost:7000/
</VirtualHost>
